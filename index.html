<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>TrashTrade 🌿 다시 쓰는 기쁨</title>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang&display=swap" rel="stylesheet">
<style>
  :root {
    --main-green: #6BA368;
    --light-green: #A1C181;
    --ivory: #F7F4EA;
    --accent-yellow: #F9CC66;
    --text-dark: #2B2B2B;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body {
    background: var(--ivory) url('https://www.transparenttextures.com/patterns/paper-fibers.png');
    font-family: 'Gowun Batang', serif;
    color: var(--text-dark);
    line-height: 1.5;
    padding-bottom: 60px;
  }
  header {
    display:flex;justify-content:space-between;align-items:center;
    padding:18px 22px;background: var(--light-green);color:#fff;
    border-bottom:3px solid var(--main-green);
  }
  header h1 { font-size: 22px; font-weight:700; }
  nav a {
    color:#fff;text-decoration:none;margin-left:16px;font-weight:600;
  }
  .cta-btn {
    background: var(--accent-yellow);
    color: var(--text-dark);
    border:none;
    padding:10px 16px;
    border-radius:10px;
    font-weight:700;
    cursor:pointer;
  }
  .hero {
    max-width:960px;margin:40px auto;
    background:#fff;border-radius:16px;
    box-shadow:0 4px 16px rgba(0,0,0,0.05);
    padding:28px;text-align:center;
  }
  .hero h2 {
    color: var(--main-green);
    font-size:26px;
    margin-bottom:12px;
  }
  .hero p {
    color:#555;
    font-size:15px;
    margin-bottom:18px;
  }
  .controls {
    max-width:960px;
    margin:20px auto;
    display:flex;gap:10px;flex-wrap:wrap;justify-content:center;
  }
  .controls input, .controls select {
    padding:8px 10px;border:1px solid #ccc;border-radius:8px;
    background:#fff;font-family:'Gowun Batang',serif;
  }
  .grid {
    max-width:960px;
    margin:0 auto;
    display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:18px;
  }
  .card {
    background:#fff;border-radius:14px;overflow:hidden;
    box-shadow:0 4px 14px rgba(0,0,0,0.05);
    display:flex;flex-direction:column;
    transition: transform .2s;
  }
  .card:hover { transform: translateY(-4px); }
  .card img {
    width:100%;height:180px;object-fit:cover;
  }
  .card-content {
    padding:14px;flex:1;display:flex;flex-direction:column;
  }
  .card-content h3 {
    color:var(--main-green);
    font-size:18px;margin-bottom:6px;
  }
  .card-content p {
    flex:1;
    font-size:14px;color:#444;
    margin-bottom:10px;
  }
  .card-footer {
    display:flex;justify-content:space-between;align-items:center;
  }
  .tag {
    background:var(--light-green);
    color:#fff;
    font-size:12px;
    padding:4px 8px;
    border-radius:8px;
  }
  .exchange-btn {
    background: var(--main-green);
    color:#fff;border:none;padding:6px 10px;border-radius:8px;
    cursor:pointer;font-weight:600;
  }
  footer {
    text-align:center;
    margin-top:40px;
    color:#666;
    font-size:13px;
  }
</style>
</head>
<body>

<header>
  <h1>TrashTrade 🌿</h1>
  <nav>
    <a href="#">홈</a>
    <a href="#">내 교환</a>
    <button class="cta-btn" id="registerBtn">물품 등록하기</button>
  </nav>
</header>

<section class="hero">
  <h2>다시 쓰는 기쁨, 지구와 함께 🌎</h2>
  <p>버려질 뻔한 물건이 누군가에게는 보물이 될 수 있어요.<br>
  우리 학교, 우리 동네에서 자원을 나누고 순환경제를 만들어봐요.</p>
  <button class="cta-btn" id="openFormBtn">나의 물건 등록하기</button>
</section>

<div class="controls">
  <input type="text" id="searchInput" placeholder="물품명으로 검색">
  <select id="categorySelect">
    <option value="">전체 카테고리</option>
    <option>책</option>
    <option>의류</option>
    <option>전자기기</option>
    <option>기타</option>
  </select>
</div>

<div class="grid" id="itemGrid">
  <div class="card">
    <img src="https://images.unsplash.com/photo-1585386959984-a415522316f0?auto=format&fit=crop&w=800&q=60" alt="책">
    <div class="card-content">
      <h3>고등학교 참고서 세트</h3>
      <p>사용감은 있지만 깨끗해요. 필요한 분께 드리고 싶어요.</p>
      <div class="card-footer">
        <span class="tag">책</span>
        <button class="exchange-btn">교환 제안</button>
      </div>
    </div>
  </div>
  <div class="card">
    <img src="https://images.unsplash.com/photo-1503341455253-b2e723bb3dbb?auto=format&fit=crop&w=800&q=60" alt="옷">
    <div class="card-content">
      <h3>니트 가디건</h3>
      <p>한 번 입은 니트예요. 환경을 위해 다시 쓰고 싶어요.</p>
      <div class="card-footer">
        <span class="tag">의류</span>
        <button class="exchange-btn">교환 제안</button>
      </div>
    </div>
  </div>
  <div class="card">
    <img src="https://images.unsplash.com/photo-1593642634367-d91a135587b5?auto=format&fit=crop&w=800&q=60" alt="전자기기">
    <div class="card-content">
      <h3>중고 키보드</h3>
      <p>작동 잘 됩니다. 다른 분이 더 잘 써주셨으면 좋겠어요 :)</p>
      <div class="card-footer">
        <span class="tag">전자기기</span>
        <button class="exchange-btn">교환 제안</button>
      </div>
    </div>
  </div>
</div>

<footer>
  🌱 TrashTrade — 함께 만드는 작은 순환, 큰 변화 🌍
</footer>

<script>
document.querySelector('#openFormBtn').addEventListener('click',()=>{
  alert("물품 등록 폼은 다음 버전에서 추가될 예정이에요 💚");
});
</script>

</body>
</html>
